name: Build WDA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: List project info
        run: |
          echo "=== Xcode version ==="
          xcodebuild -version
          echo ""
          echo "=== Project schemes & targets ==="
          xcodebuild -list -project WebDriverAgent.xcodeproj

      - name: Build
        run: |
          xcodebuild build -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Debug build output
        run: |
          echo "=== Build directory tree ==="
          find ./build -name "*.app" -type d 2>/dev/null
          echo ""
          echo "=== All products ==="
          find ./build/Build/Products -maxdepth 2 -type d 2>/dev/null
          echo ""
          echo "=== Build settings ==="
          xcodebuild -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build \
            -showBuildSettings 2>/dev/null | grep -E "BUILT_PRODUCTS_DIR|FULL_PRODUCT_NAME|PRODUCT_NAME|WRAPPER_NAME|CONFIGURATION"

      - name: Package IPA
        run: |
          APP_PATH=$(find ./build -name "*.app" -type d | grep -v "Frameworks" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found in build directory"
            exit 1
          fi
          echo "Using app: $APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r WebDriverAgent.ipa Payload
          ls -lh WebDriverAgent.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgent
          path: WebDriverAgent.ipa
