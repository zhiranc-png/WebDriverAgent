name: Build WDA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          xcodebuild build -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner -destination 'generic/platform=iOS' \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO
      - name: Package IPA
        run: |
          APP_PATH=$(find ./build -name "WebDriverAgentRunner.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: WebDriverAgentRunner.app not found"
            echo "Searching for any .app files:"
            find ./build -name "*.app" -type d
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r WebDriverAgent.ipa Payload
          ls -la WebDriverAgent.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgent
          path: WebDriverAgent.ipa
