name: Build WDA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          xcodebuild build -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
      - name: Package IPA
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "WebDriverAgentRunner.app" -type d | head -1)
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r WebDriverAgent.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgent
          path: WebDriverAgent.ipa
